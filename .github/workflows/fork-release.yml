name: Fork release

# TemMax/t3code only: manual desktop release on free GitHub runners.
# macOS arm64 is Developer ID signed and notarized; Windows x64 is unsigned.
# The GitHub release it publishes is the desktop auto-update feed.

on:
  workflow_dispatch:
    inputs:
      version:
        description: Upstream version (0.1.7), or fork build ahead of the next upstream release (0.1.7-fork.1)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: fork-release
  cancel-in-progress: false

env:
  VERSION: ${{ inputs.version }}
  # Apple bundle id registered on team 93FFKDMA3D; com.t3tools.t3code belongs to T3's team.
  FORK_APP_ID: com.temmax.t3code

jobs:
  build:
    name: Build ${{ matrix.label }}
    if: github.repository == 'TemMax/t3code'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macOS arm64
            runner: macos-15
            platform: mac
            target: dmg
            arch: arm64
            rust_target: aarch64-apple-darwin
          - label: Windows x64
            runner: windows-latest
            platform: win
            target: nsis
            arch: x64
            rust_target: x86_64-pc-windows-msvc
    steps:
      - name: Validate version
        shell: bash
        run: |
          # X.Y.Z-fork.N sorts after X.Y.(Z-1) and before upstream X.Y.Z, so updates flow both ways.
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-fork\.[0-9]+)?$ ]]; then
            echo "Version must look like 1.2.3 or 1.2.3-fork.1, got '$VERSION'." >&2
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v6
        with:
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Setup dependencies
        uses: ./.github/actions/setup-ci-deps

      - name: Align package versions and app id
        shell: bash
        run: |
          node scripts/update-release-package-versions.ts "$VERSION"
          sed -i.bak "s/^const DESKTOP_APP_ID = \"com\.t3tools\.t3code\";/const DESKTOP_APP_ID = \"$FORK_APP_ID\";/" scripts/build-desktop-artifact.ts
          rm scripts/build-desktop-artifact.ts.bak
          grep -q "^const DESKTOP_APP_ID = \"$FORK_APP_ID\";" scripts/build-desktop-artifact.ts

      - name: Build desktop artifact
        shell: bash
        env:
          CSC_LINK: ${{ matrix.platform == 'mac' && secrets.CSC_LINK || '' }}
          CSC_KEY_PASSWORD: ${{ matrix.platform == 'mac' && secrets.CSC_KEY_PASSWORD || '' }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          MACOS_PROVISIONING_PROFILE: ${{ secrets.MACOS_PROVISIONING_PROFILE }}
          # Required by signed macOS builds; only feeds the passkey entitlement (T3 Connect sign-in).
          T3CODE_CLERK_PASSKEY_RP_DOMAINS: clerk.t3.codes
        run: |
          set -euo pipefail
          args=(
            --platform "${{ matrix.platform }}"
            --target "${{ matrix.target }}"
            --arch "${{ matrix.arch }}"
            --build-version "$VERSION"
            --verbose
          )

          if [[ "${{ matrix.platform }}" == "mac" ]]; then
            for name in CSC_LINK CSC_KEY_PASSWORD APPLE_API_KEY APPLE_API_KEY_ID APPLE_API_ISSUER APPLE_TEAM_ID MACOS_PROVISIONING_PROFILE; do
              if [[ -z "${!name}" ]]; then
                echo "Missing secret $name." >&2
                exit 1
              fi
            done

            key_path="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID}.p8"
            printf '%s' "$APPLE_API_KEY" | base64 -D > "$key_path"
            export APPLE_API_KEY="$key_path"

            profile_path="$RUNNER_TEMP/t3code.provisionprofile"
            printf '%s' "$MACOS_PROVISIONING_PROFILE" | base64 -D > "$profile_path"
            security cms -D -i "$profile_path" >/dev/null
            export T3CODE_APPLE_TEAM_ID="$APPLE_TEAM_ID"
            export T3CODE_MACOS_PROVISIONING_PROFILE="$profile_path"

            args+=(--signed)
          else
            unset APPLE_API_KEY APPLE_API_KEY_ID APPLE_API_ISSUER
          fi

          vp run dist:desktop:artifact "${args[@]}"

      - name: Verify macOS signature and notarization
        if: matrix.platform == 'mac'
        shell: bash
        run: |
          set -euo pipefail
          dmg="$(ls release/*.dmg | head -1)"
          mount_dir="$(mktemp -d)"
          hdiutil attach "$dmg" -nobrowse -readonly -mountpoint "$mount_dir" >/dev/null
          app="$(ls -d "$mount_dir"/*.app | head -1)"
          codesign --verify --deep --strict "$app"
          # Both contact Apple; retry transient network failures.
          for attempt in 1 2 3; do
            if xcrun stapler validate "$app" && spctl --assess --type execute --verbose "$app"; then
              break
            fi
            if [[ $attempt == 3 ]]; then
              exit 1
            fi
            sleep 15
          done
          codesign -dv "$app" 2>&1 | grep -E "^(Identifier|TeamIdentifier)="
          hdiutil detach "$mount_dir" >/dev/null

      - name: Collect release assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-publish
          shopt -s nullglob
          for file in release/*.dmg release/*.zip release/*.exe release/*.blockmap release/*.yml; do
            [[ "$file" == */builder-debug.yml ]] && continue
            cp "$file" release-publish/
          done
          ls -la release-publish

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: desktop-${{ matrix.platform }}-${{ matrix.arch }}
          path: release-publish/*
          if-no-files-found: error
          compression-level: 1

  release:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: desktop-*
          path: release-assets
          merge-multiple: true

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          tag="v$VERSION"
          upstream_tag="v${VERSION%%-fork.*}"
          if [[ "$VERSION" == *-fork.* ]]; then
            notes="Fork-only build between upstream releases: the fork's features on top of upstream. Upstream $upstream_tag will supersede it."
          else
            notes="Fork build of upstream $tag. Upstream notes: https://github.com/pingdotgg/t3code/releases/tag/$tag"
          fi
          ls -la release-assets
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" release-assets/* --clobber
          else
            gh release create "$tag" release-assets/* \
              --target "$GITHUB_SHA" \
              --title "T3 Code $tag (fork)" \
              --notes "$notes" \
              --latest
          fi
